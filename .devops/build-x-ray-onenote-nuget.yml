# Publishes X-Ray.OneNote to nuget.org: the dependency-free OneNote (.one) reader and PDF exporter
# under XRay.OneNote/src/XRay.OneNote, whose API lives in the XRay.OneNote namespace. Modelled on
# x-ray-content's .devops/build-x-ray-nuget.yml: CalVer versioning off the build id, pack, then
# push through the shared service connection.
variables:
  # The packable project. `projects` (restore/build) is a multi-line input, one path per line,
  # while `packagesToPack` is a pattern input split on semicolons only; keep that in mind if a
  # second package joins this pipeline.
  library: './XRay.OneNote/src/XRay.OneNote/XRay.OneNote.csproj'
  packList: '$(library)'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# x-ray-others holds several packages side by side, each with its own pipeline. The path filter
# keeps a change to a sibling package from shipping a new X-Ray.OneNote version with no OneNote change.
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - XRay.OneNote/*
    - .devops/build-x-ray-onenote-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
# Pinned past the 4.3.0 this task installs by default: nuget.exe pushes the .snupkg beside each
# .nupkg only from 4.9 on (see the push step).
- task: NuGetToolInstaller@0
  inputs:
    versionSpec: '6.x'


- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(library)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(library)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'
  displayName: 'build'

# No test step: the parity and corpus tests read their fixtures from the test_documents submodule
# (curiosity-ai/test_documents, onenote/), which this job does not check out. Run them locally
# (see XRay.OneNote/CLAUDE.md) until a test stage with submodule checkout is added.

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(packList)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest"'
    nobuild: true
  displayName: 'pack nuget'

# The symbol package (.snupkg, from IncludeSymbols in the root Directory.Build.props) sits next
# to the .nupkg in the staging directory, and nuget push (4.9 and later, pinned above) sends it to
# nuget.org's symbol server along with the package, so it needs no step of its own.

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
  displayName: 'push nuget'
