# Publishes the X-Ray.PS family to nuget.org: X-Ray.PS (the pure managed PostScript, EPS and XPS
# reader and converter under XRay.PS/src/XRay.PS, whose API lives in the XRay.PS namespace) and its
# optional companion X-Ray.PS.Skia (a SkiaSharp raster writer). Modelled on
# .devops/build-x-ray-psd-nuget.yml: CalVer versioning off the build id, pack, then push through
# the shared service connection.
#
# Both packages ship in one run, from one version: X-Ray.PS.Skia reaches the core through a
# ProjectReference, so `dotnet pack` writes its dependency on X-Ray.PS at the version of this run.
variables:
  library: './XRay.PS/src/XRay.PS/XRay.PS.csproj'
  skia: './XRay.PS/src/XRay.PS.Skia/XRay.PS.Skia.csproj'
  # `packagesToPack` is a pattern input split on semicolons only, not on newlines.
  packList: '$(library);$(skia)'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

trigger:
  branches:
    include:
    - main
  paths:
    include:
    - XRay.PS/*
    - .devops/build-x-ray-ps-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
# Pinned past the default 4.3.0: nuget.exe pushes the .snupkg beside each .nupkg only from 4.9 on.
- task: NuGetToolInstaller@0
  inputs:
    versionSpec: '6.x'

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(library)
      $(skia)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(library)
      $(skia)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'
  displayName: 'build'

# No test step: the tests read fixtures from the test_documents submodule and the test project
# carries the Linux Skia native assets. Run them locally (see XRay.PS/CLAUDE.md).

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(packList)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest"'
    nobuild: true
  displayName: 'pack nuget'

# The push picks up every .nupkg in the staging directory; each .snupkg beside it goes to the
# symbol server with it.
- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
  displayName: 'push nuget'
