# Publishes every package in x-ray-others to nuget.org in one run, from one version:
#   X-Ray.Psd, X-Ray.Psd.Skia, X-Ray.Psd.Text   (XRay.Psd/)
#   X-Ray.Email                                  (XRay.Email/)
#   X-Ray.Ics                                    (XRay.Ics/)
#   X-Ray.PS, X-Ray.PS.Skia                      (XRay.PS/)
#   X-Ray.OneNote                                (XRay.OneNote/)
#   X-Ray.3D                                     (XRay.3D/)
# Modelled on x-ray-content's .devops/build-x-ray-nuget.yml: CalVer versioning off the build id,
# pack, then push through the shared service connection.
#
# One pipeline for the repository, not one per package: the steps were identical apart from the
# project list, and a single run keeps the family's versions in step. The cost is that a change to
# one package publishes a new version of all of them (each package keeps its own id, so nothing
# collides; a package whose code did not change just gets a new version number). Packages that
# depend on a sibling (X-Ray.Psd.Skia and X-Ray.Psd.Text on X-Ray.Psd, X-Ray.PS.Skia on X-Ray.PS)
# reach it through a ProjectReference, so the build writes the dependency at this run's version.
variables:
  # Every packable project, one path per line in the restore and build steps below.
  psd: './XRay.Psd/src/XRay.Psd/XRay.Psd.csproj'
  psdSkia: './XRay.Psd/src/XRay.Psd.Skia/XRay.Psd.Skia.csproj'
  psdText: './XRay.Psd/src/XRay.Psd.Text/XRay.Psd.Text.csproj'
  email: './XRay.Email/src/XRay.Email/XRay.Email.csproj'
  ics: './XRay.Ics/src/XRay.Ics/XRay.Ics.csproj'
  ps: './XRay.PS/src/XRay.PS/XRay.PS.csproj'
  psSkia: './XRay.PS/src/XRay.PS.Skia/XRay.PS.Skia.csproj'
  oneNote: './XRay.OneNote/src/XRay.OneNote/XRay.OneNote.csproj'
  threeD: './XRay.3D/src/XRay.ThreeD/XRay.ThreeD.csproj'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# Any change under a package folder, or to the shared build files, publishes. The shared files are
# listed because Directory.Build.props and .targets change every package's metadata.
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - XRay.Psd/*
    - XRay.Email/*
    - XRay.Ics/*
    - XRay.PS/*
    - XRay.OneNote/*
    - XRay.3D/*
    - Directory.Build.props
    - Directory.Build.targets
    - assets/*
    - .devops/build-x-ray-others-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(psd)
      $(psdSkia)
      $(psdText)
      $(email)
      $(ics)
      $(ps)
      $(psSkia)
      $(oneNote)
      $(threeD)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(psd)
      $(psdSkia)
      $(psdText)
      $(email)
      $(ics)
      $(ps)
      $(psSkia)
      $(oneNote)
      $(threeD)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest /p:GeneratePackageOnBuild=true'
  displayName: 'build'

# No test step: the tests read their fixtures from the test_documents submodule
# (curiosity-ai/test_documents), which this job does not check out, and the test projects carry
# only the Linux Skia and HarfBuzz native assets while this job runs on Windows. Run them locally
# (`dotnet test --solution XRay.Others.slnx`, see CLAUDE.md) until a Linux test stage with
# submodule checkout is added.

# Push every package in one step, as sentence-transformers-sharp does. No NuGetToolInstaller step:
# it put nuget.exe 6.4 on the path, which refuses an API key service connection, whereas the push
# task's own bundled nuget.exe accepts it. The packages are written by the build itself
# (/p:GeneratePackageOnBuild=true, one per project), not by a separate pack step: the pack step with a
# semicolon-separated project list packed only the first project, so only one package was ever
# pushed. No symbol packages (.snupkg) are produced either, so nothing beside a .nupkg can fail the push.

- task: NuGetCommand@2
  displayName: 'push nuget'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.SourcesDirectory)/**/bin/$(buildConfiguration)/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
