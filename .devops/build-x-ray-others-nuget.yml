# Publishes every package in x-ray-others to nuget.org in one run, from one version:
#   X-Ray.Psd, X-Ray.Psd.Skia, X-Ray.Psd.Text   (XRay.Psd/)
#   X-Ray.Email                                  (XRay.Email/)
#   X-Ray.Ics                                    (XRay.Ics/)
#   X-Ray.PS, X-Ray.PS.Skia                      (XRay.PS/)
#   X-Ray.OneNote                                (XRay.OneNote/)
# Modelled on x-ray-content's .devops/build-x-ray-nuget.yml: CalVer versioning off the build id,
# pack, then push through the shared service connection.
#
# One pipeline for the repository, not one per package: the steps were identical apart from the
# project list, and a single run keeps the family's versions in step. The cost is that a change to
# one package publishes a new version of all of them (each package keeps its own id, so nothing
# collides; a package whose code did not change just gets a new version number). Packages that
# depend on a sibling (X-Ray.Psd.Skia and X-Ray.Psd.Text on X-Ray.Psd, X-Ray.PS.Skia on X-Ray.PS)
# reach it through a ProjectReference, so `dotnet pack` writes the dependency at this run's version.
variables:
  # Every packable project, in dependency order. The two tasks that take a list do not take it
  # the same way: `projects` (restore/build) is a multi-line input, one path per line, while
  # `packagesToPack` is a *pattern* input that is split on semicolons only; a newline-separated
  # value there is one pattern containing a newline, which matches no file, and the pack step
  # fails with "No files matched the search pattern". Hence `packList` below.
  psd: './XRay.Psd/src/XRay.Psd/XRay.Psd.csproj'
  psdSkia: './XRay.Psd/src/XRay.Psd.Skia/XRay.Psd.Skia.csproj'
  psdText: './XRay.Psd/src/XRay.Psd.Text/XRay.Psd.Text.csproj'
  email: './XRay.Email/src/XRay.Email/XRay.Email.csproj'
  ics: './XRay.Ics/src/XRay.Ics/XRay.Ics.csproj'
  ps: './XRay.PS/src/XRay.PS/XRay.PS.csproj'
  psSkia: './XRay.PS/src/XRay.PS.Skia/XRay.PS.Skia.csproj'
  oneNote: './XRay.OneNote/src/XRay.OneNote/XRay.OneNote.csproj'
  # The same projects as one semicolon-separated pattern, for `packagesToPack`.
  packList: '$(psd);$(psdSkia);$(psdText);$(email);$(ics);$(ps);$(psSkia);$(oneNote)'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# Any change under a package folder, or to the shared build files, publishes. The shared files are
# listed because Directory.Build.props and .targets change every package's metadata.
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - XRay.Psd/*
    - XRay.Email/*
    - XRay.Ics/*
    - XRay.PS/*
    - XRay.OneNote/*
    - Directory.Build.props
    - Directory.Build.targets
    - assets/*
    - .devops/build-x-ray-others-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
# nuget.exe 7.6 or later. An external service connection that authenticates with an API key (the
# `nuget-curiosity-org` push below) is refused by older versions, and the task's default is 6.x.
# It also has to be 4.9 or later for the push to send the .snupkg beside each .nupkg (see the push
# step).
- task: NuGetToolInstaller@1
  inputs:
    versionSpec: '>=7.6.0'


- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(psd)
      $(psdSkia)
      $(psdText)
      $(email)
      $(ics)
      $(ps)
      $(psSkia)
      $(oneNote)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(psd)
      $(psdSkia)
      $(psdText)
      $(email)
      $(ics)
      $(ps)
      $(psSkia)
      $(oneNote)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'
  displayName: 'build'

# No test step: the tests read their fixtures from the test_documents submodule
# (curiosity-ai/test_documents), which this job does not check out, and the test projects carry
# only the Linux Skia and HarfBuzz native assets while this job runs on Windows. Run them locally
# (`dotnet test --solution XRay.Others.slnx`, see CLAUDE.md) until a Linux test stage with
# submodule checkout is added.

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(packList)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest"'
    nobuild: true
  displayName: 'pack nuget'

# Marks that every package was built and packed, so the push steps below may run even when an
# earlier push failed, but never after a failed build or pack.
- task: PowerShell@2
  displayName: 'mark packed'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "##vso[task.setvariable variable=packed;]true"

# One push step per package (templates/push-nuget.yml), not one glob push. A glob push stops at the
# first package that fails, and a later package then never reaches nuget.org (the first runs of the
# multi-package pipelines published one package each). Each step also skips a package that is already
# on nuget.org at this version, so a re-run of the same build completes the set instead of failing on
# the packages that went out the first time. The .snupkg beside each .nupkg is pushed with it.
- template: templates/push-nuget.yml
  parameters:
    packages:
    - X-Ray.Psd
    - X-Ray.Psd.Skia
    - X-Ray.Psd.Text
    - X-Ray.Email
    - X-Ray.Ics
    - X-Ray.PS
    - X-Ray.PS.Skia
    - X-Ray.OneNote
