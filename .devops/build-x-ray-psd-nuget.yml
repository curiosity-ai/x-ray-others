# Publishes the X-Ray.Psd family to nuget.org: X-Ray.Psd (the dependency-free PSD/PSB reader and
# compositor under XRay.Psd/src/XRay.Psd, whose API lives in the XRay.Psd namespace), and its two
# optional companions X-Ray.Psd.Skia (SkiaSharp interop) and X-Ray.Psd.Text (type-layer
# re-rendering with SkiaSharp and HarfBuzz). Modelled on x-ray-content's .devops/build-x-ray-nuget.yml:
# CalVer versioning off the build id, pack, then push through the shared service connection.
#
# The three packages ship in one run, from one version. X-Ray.Psd.Skia and X-Ray.Psd.Text reach the
# core through a ProjectReference, so `dotnet pack` writes their dependency on X-Ray.Psd at the
# version of this run; publishing one on its own would leave the others pointing elsewhere.
variables:
  # Every packable project, in dependency order. The two tasks that take a list do not take it
  # the same way: `projects` (restore/build) is a multi-line input, one path per line, while
  # `packagesToPack` is a *pattern* input that is split on semicolons only; a newline-separated
  # value there is one pattern containing a newline, which matches no file, and the pack step
  # fails with "No files matched the search pattern". Hence `packList` below.
  library: './XRay.Psd/src/XRay.Psd/XRay.Psd.csproj'
  skia: './XRay.Psd/src/XRay.Psd.Skia/XRay.Psd.Skia.csproj'
  text: './XRay.Psd/src/XRay.Psd.Text/XRay.Psd.Text.csproj'
  # The same three projects as one semicolon-separated pattern, for `packagesToPack`.
  packList: '$(library);$(skia);$(text)'
  buildConfiguration: 'Release'
  targetVersion: yy.M.$(build.buildId)

# x-ray-others holds several packages side by side, each with its own pipeline. The path filter
# keeps a change to a sibling package from shipping a new X-Ray.Psd version with no PSD change.
trigger:
  branches:
    include:
    - main
  paths:
    include:
    - XRay.Psd/*
    - .devops/build-x-ray-psd-nuget.yml

pool:
  vmImage: 'windows-latest'

steps:
# Pinned past the 4.3.0 this task installs by default: nuget.exe pushes the .snupkg beside each
# .nupkg only from 4.9 on (see the push step).
- task: NuGetToolInstaller@0
  inputs:
    versionSpec: '6.x'


- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"


- task: UseDotNet@2
  displayName: 'Use .NET 10.0 SDK'
  inputs:
    packageType: sdk
    version: 10.x
    includePreviewVersions: false
    installationPath: $(Agent.ToolsDirectory)\dotnet

- task: DotNetCoreCLI@2
  inputs:
    command: 'restore'
    projects: |
      $(library)
      $(skia)
      $(text)
  displayName: 'restore nuget'

- task: DotNetCoreCLI@2
  inputs:
    command: 'build'
    projects: |
      $(library)
      $(skia)
      $(text)
    arguments: '-c $(buildConfiguration) /p:Version=$(targetVersion) /p:LangVersion=latest'
  displayName: 'build'

# No test step: the tests read their fixtures from the test_documents submodule
# (curiosity-ai/test_documents, psd/), and the test projects carry only the Linux Skia and
# HarfBuzz native assets. Run them locally (see XRay.Psd/CLAUDE.md) until a Linux test stage
# with submodule checkout is added.

- task: DotNetCoreCLI@2
  inputs:
    command: 'pack'
    packagesToPack: '$(packList)'
    packDirectory: '$(Build.ArtifactStagingDirectory)'
    versioningScheme: 'off'
    configuration: '$(buildConfiguration)'
    buildProperties: 'Version="$(targetVersion)";LangVersion="latest"'
    nobuild: true
  displayName: 'pack nuget'

# The push below picks up every .nupkg in the staging directory, so all three packages go out in
# one step. NuGet accepts them in any order: a package may be published before a dependency it
# names, and the dependency only has to exist by the time a consumer restores. Each package's
# symbol package (.snupkg, from IncludeSymbols in the root Directory.Build.props) sits next to it
# in the same directory, and nuget push (4.9 and later, pinned above) sends it to nuget.org's
# symbol server along with the .nupkg, so it needs no step of its own.

- task: NuGetCommand@2
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/**/*.nupkg'
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
  displayName: 'push nuget'
