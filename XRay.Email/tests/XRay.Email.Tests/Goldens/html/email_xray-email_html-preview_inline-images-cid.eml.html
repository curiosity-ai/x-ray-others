<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Two inline images and one attachment</title>
<style>.xray-mail{font-family:Calibri,'Segoe UI',Arial,sans-serif;font-size:11pt;color:#000}.xray-mail-header{font-size:10pt;border-bottom:1px solid #c8c8c8;padding:0 0 8px;margin:0 0 12px}.xray-mail-header table{border-collapse:collapse}.xray-mail-header th{text-align:left;font-weight:bold;vertical-align:top;padding:1px 14px 1px 0;white-space:nowrap}.xray-mail-header td{padding:1px 0;vertical-align:top}.xray-mail-header .xray-mail-subject td{font-weight:bold;font-size:12pt}.xray-mail-text{white-space:pre-wrap;word-wrap:break-word}</style>
</head>
<body>
<div class="xray-mail">
<div class="xray-mail-header">
<table>
<tr><th>From:</th><td>Newsletter &lt;news@example.com&gt;</td></tr>
<tr><th>Sent:</th><td>Tuesday, January 9, 2024 8:00 AM UTC</td></tr>
<tr><th>To:</th><td>Reader &lt;reader@example.com&gt;</td></tr>
<tr class="xray-mail-subject"><th>Subject:</th><td>Two inline images and one attachment</td></tr>
<tr><th>Attachments:</th><td><span class="xray-mail-attachment">notes.txt (15 B)</span></td></tr>
</table>
</div>
<div class="xray-mail-body">

<p>Logo by content id: <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgAAACAAFUok9fAAAAAElFTkSuQmCC" alt="logo" width="1" height="1"></p>
<p>Banner by content id with escapes: <img src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="banner"></p>
<p>Image by content location: <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgAAACAAFUok9fAAAAAElFTkSuQmCC" alt="pixel"></p>
<p>Missing image: <img src="cid:missing@example.com" alt="missing"></p>
<div style="background-image:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgAAACAAFUok9fAAAAAElFTkSuQmCC)">styled</div>

</div>
</div>
</body>
</html>
